<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>SSE Inspector</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;500;600&family=DM+Sans:wght@400;500;600&display=swap" rel="stylesheet" />
  <style>
    :root {
      --bg: #0d0f14;
      --bg2: #13161e;
      --bg3: #1a1e28;
      --bg4: #222738;
      --border: #2a3045;
      --border2: #343c56;
      --text: #e2e6f3;
      --text2: #8b93b0;
      --text3: #555f80;
      --accent: #4f9eff;
      --accent2: #2563eb;
      --green: #34d399;
      --red: #f87171;
      --yellow: #fbbf24;
      --purple: #a78bfa;
      --mono: 'JetBrains Mono', monospace;
      --sans: 'DM Sans', sans-serif;
    }

    * { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      width: 560px;
      height: 600px;
      background: var(--bg);
      color: var(--text);
      font-family: var(--sans);
      display: flex;
      flex-direction: column;
      overflow: hidden;
    }

    /* Header */
    .header {
      display: flex;
      align-items: center;
      gap: 10px;
      padding: 12px 16px;
      background: var(--bg2);
      border-bottom: 1px solid var(--border);
      flex-shrink: 0;
    }

    .logo {
      display: flex;
      align-items: center;
      gap: 8px;
    }

    .logo-icon {
      width: 22px;
      height: 22px;
      background: linear-gradient(135deg, var(--accent) 0%, var(--purple) 100%);
      border-radius: 5px;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 11px;
    }

    .logo-text {
      font-family: var(--mono);
      font-size: 13px;
      font-weight: 600;
      letter-spacing: 0.5px;
      color: var(--text);
    }

    .logo-text span {
      color: var(--accent);
    }

    .header-right {
      margin-left: auto;
      display: flex;
      align-items: center;
      gap: 8px;
    }

    .status-dot {
      width: 7px;
      height: 7px;
      border-radius: 50%;
      background: var(--green);
      box-shadow: 0 0 6px var(--green);
      animation: pulse 2s infinite;
    }

    .status-dot.paused {
      background: var(--yellow);
      box-shadow: 0 0 6px var(--yellow);
      animation: none;
    }

    @keyframes pulse {
      0%, 100% { opacity: 1; }
      50% { opacity: 0.4; }
    }

    .btn {
      font-family: var(--mono);
      font-size: 11px;
      font-weight: 500;
      padding: 5px 10px;
      border-radius: 5px;
      border: 1px solid var(--border2);
      background: var(--bg3);
      color: var(--text2);
      cursor: pointer;
      transition: all 0.15s;
      letter-spacing: 0.3px;
    }

    .btn:hover {
      background: var(--bg4);
      color: var(--text);
      border-color: var(--accent);
    }

    .btn.danger:hover {
      border-color: var(--red);
      color: var(--red);
    }

    /* Toolbar */
    .toolbar {
      display: flex;
      align-items: center;
      gap: 8px;
      padding: 10px 16px;
      background: var(--bg2);
      border-bottom: 1px solid var(--border);
      flex-shrink: 0;
    }

    .search-wrap {
      flex: 1;
      position: relative;
    }

    .search-icon {
      position: absolute;
      left: 10px;
      top: 50%;
      transform: translateY(-50%);
      color: var(--text3);
      font-size: 13px;
      pointer-events: none;
    }

    #search {
      width: 100%;
      background: var(--bg3);
      border: 1px solid var(--border);
      border-radius: 6px;
      padding: 7px 10px 7px 32px;
      font-family: var(--mono);
      font-size: 12px;
      color: var(--text);
      outline: none;
      transition: border-color 0.15s;
    }

    #search:focus { border-color: var(--accent); }
    #search::placeholder { color: var(--text3); }

    .filter-group {
      display: flex;
      gap: 4px;
    }

    .filter-btn {
      font-family: var(--mono);
      font-size: 10px;
      padding: 5px 9px;
      border-radius: 4px;
      border: 1px solid var(--border);
      background: var(--bg3);
      color: var(--text3);
      cursor: pointer;
      transition: all 0.15s;
      letter-spacing: 0.3px;
    }

    .filter-btn.active {
      background: var(--accent2);
      border-color: var(--accent);
      color: #fff;
    }

    /* Streams bar */
    .streams-bar {
      display: flex;
      gap: 6px;
      padding: 8px 16px;
      background: var(--bg);
      border-bottom: 1px solid var(--border);
      flex-shrink: 0;
      overflow-x: auto;
      min-height: 38px;
      align-items: center;
    }

    .streams-bar::-webkit-scrollbar { height: 3px; }
    .streams-bar::-webkit-scrollbar-track { background: transparent; }
    .streams-bar::-webkit-scrollbar-thumb { background: var(--border2); border-radius: 2px; }

    .stream-chip {
      display: flex;
      align-items: center;
      gap: 5px;
      padding: 3px 9px;
      border-radius: 20px;
      border: 1px solid var(--border2);
      background: var(--bg3);
      font-family: var(--mono);
      font-size: 10px;
      color: var(--text2);
      white-space: nowrap;
      cursor: pointer;
      transition: all 0.15s;
    }

    .stream-chip:hover, .stream-chip.active {
      border-color: var(--accent);
      color: var(--accent);
      background: rgba(79, 158, 255, 0.08);
    }

    .stream-chip .dot {
      width: 5px;
      height: 5px;
      border-radius: 50%;
      background: var(--green);
    }

    .stream-chip .dot.closed { background: var(--text3); }
    .stream-chip .dot.error { background: var(--red); }

    .no-streams {
      font-family: var(--mono);
      font-size: 11px;
      color: var(--text3);
    }

    /* Events list */
    .events-container {
      flex: 1;
      overflow-y: auto;
      padding: 8px 0;
    }

    .events-container::-webkit-scrollbar { width: 4px; }
    .events-container::-webkit-scrollbar-track { background: transparent; }
    .events-container::-webkit-scrollbar-thumb { background: var(--border2); border-radius: 2px; }

    .empty-state {
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      height: 100%;
      gap: 10px;
      color: var(--text3);
    }

    .empty-icon {
      font-size: 32px;
      opacity: 0.4;
    }

    .empty-text {
      font-family: var(--mono);
      font-size: 12px;
      text-align: center;
      line-height: 1.6;
    }

    /* Event item */
    .event-item {
      margin: 0 8px 4px;
      border-radius: 7px;
      border: 1px solid var(--border);
      background: var(--bg2);
      overflow: hidden;
      transition: border-color 0.15s;
    }

    .event-item:hover { border-color: var(--border2); }
    .event-item.expanded { border-color: var(--accent); }

    .event-header {
      display: flex;
      align-items: center;
      gap: 10px;
      padding: 8px 12px;
      cursor: pointer;
      user-select: none;
    }

    .event-type-badge {
      font-family: var(--mono);
      font-size: 9px;
      font-weight: 600;
      padding: 2px 7px;
      border-radius: 3px;
      letter-spacing: 0.5px;
      text-transform: uppercase;
      background: rgba(79, 158, 255, 0.15);
      color: var(--accent);
      border: 1px solid rgba(79, 158, 255, 0.2);
      flex-shrink: 0;
    }

    .event-type-badge.message {
      background: rgba(52, 211, 153, 0.12);
      color: var(--green);
      border-color: rgba(52, 211, 153, 0.2);
    }

    .event-url {
      font-family: var(--mono);
      font-size: 10px;
      color: var(--text3);
      flex: 1;
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
    }

    .event-preview {
      font-family: var(--mono);
      font-size: 11px;
      color: var(--text2);
      flex: 2;
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
    }

    .event-time {
      font-family: var(--mono);
      font-size: 10px;
      color: var(--text3);
      flex-shrink: 0;
    }

    .chevron {
      color: var(--text3);
      font-size: 10px;
      transition: transform 0.2s;
      flex-shrink: 0;
    }

    .event-item.expanded .chevron { transform: rotate(90deg); }

    .event-body {
      display: none;
      border-top: 1px solid var(--border);
      background: var(--bg);
    }

    .event-item.expanded .event-body { display: block; }

    .event-raw {
      padding: 12px;
      font-family: var(--mono);
      font-size: 11px;
      line-height: 1.7;
      color: var(--text2);
      white-space: pre-wrap;
      word-break: break-all;
      max-height: 250px;
      overflow-y: auto;
    }

    .event-raw::-webkit-scrollbar { width: 3px; }
    .event-raw::-webkit-scrollbar-thumb { background: var(--border2); border-radius: 2px; }

    /* JSON syntax highlighting */
    .json-key { color: var(--accent); }
    .json-string { color: var(--green); }
    .json-number { color: var(--purple); }
    .json-bool { color: var(--yellow); }
    .json-null { color: var(--text3); }

    .event-meta {
      display: flex;
      gap: 16px;
      padding: 8px 12px;
      border-top: 1px solid var(--border);
      background: var(--bg2);
    }

    .meta-item {
      font-family: var(--mono);
      font-size: 10px;
      color: var(--text3);
    }

    .meta-item span { color: var(--text2); }

    .copy-btn {
      margin-left: auto;
      font-family: var(--mono);
      font-size: 10px;
      padding: 3px 8px;
      border-radius: 4px;
      border: 1px solid var(--border2);
      background: var(--bg3);
      color: var(--text3);
      cursor: pointer;
      transition: all 0.15s;
    }

    .copy-btn:hover { color: var(--accent); border-color: var(--accent); }

    /* Footer */
    .footer {
      display: flex;
      align-items: center;
      padding: 8px 16px;
      background: var(--bg2);
      border-top: 1px solid var(--border);
      flex-shrink: 0;
      gap: 12px;
    }

    .footer-stat {
      font-family: var(--mono);
      font-size: 10px;
      color: var(--text3);
    }

    .footer-stat span { color: var(--text2); }

    .scroll-bottom-btn {
      margin-left: auto;
      font-family: var(--mono);
      font-size: 10px;
      padding: 4px 9px;
      border-radius: 4px;
      border: 1px solid var(--border2);
      background: var(--bg3);
      color: var(--text3);
      cursor: pointer;
      transition: all 0.15s;
    }

    .scroll-bottom-btn:hover { color: var(--accent); border-color: var(--accent); }
  </style>
</head>
<body>
  <div class="header">
    <div class="logo">
      <div class="logo-icon">⚡</div>
      <div class="logo-text">SSE <span>Inspector</span></div>
    </div>
    <div class="header-right">
      <div class="status-dot" id="statusDot"></div>
      <button class="btn" id="pauseBtn">Pause</button>
      <button class="btn danger" id="clearBtn">Clear</button>
    </div>
  </div>

  <div class="toolbar">
    <div class="search-wrap">
      <span class="search-icon">⌕</span>
      <input type="text" id="search" placeholder="Filter events by data, type, or URL..." />
    </div>
    <div class="filter-group">
      <button class="filter-btn active" data-filter="all">ALL</button>
      <button class="filter-btn" data-filter="message">MSG</button>
      <button class="filter-btn" data-filter="custom">EVT</button>
    </div>
  </div>

  <div class="streams-bar" id="streamsBar">
    <span class="no-streams">No streams detected yet</span>
  </div>

  <div class="events-container" id="eventsList">
    <div class="empty-state">
      <div class="empty-icon">📡</div>
      <div class="empty-text">Listening for SSE streams...<br/>Navigate to a page that uses Server-Sent Events</div>
    </div>
  </div>

  <div class="footer">
    <div class="footer-stat">Events: <span id="statEvents">0</span></div>
    <div class="footer-stat">Streams: <span id="statStreams">0</span></div>
    <button class="scroll-bottom-btn" id="scrollBottomBtn">↓ Latest</button>
  </div>

  <script src="popup.js"></script>
</body>
</html>
